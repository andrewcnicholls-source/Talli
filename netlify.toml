# =====================================================================
#  Netlify configuration — shared by BOTH sites
#
#  One repository feeds two Netlify projects:
#
#    talliconz   -> talli.co.nz            builds branch `main`
#    talli-test  -> talli-test.netlify.app builds branch `staging`
#
#  Netlify reads this file from whichever branch it is building, so it
#  applies to both. The build step is therefore written to do NOTHING
#  unless it is running for the test project: production publishes the
#  repo exactly as it did before this file existed.
# =====================================================================

[build]
  # The site is plain static files at the repo root. There is nothing to
  # compile; the command only stamps out the test site's robots rules.
  publish = "."
  command = "bash ./netlify/build.sh"
