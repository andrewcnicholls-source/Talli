# Talli Parking — driveway motion automations
#
# Home Assistant package. Drop this in config/packages/talli-driveway.yaml and add
# to configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# BEFORE IT WILL RUN: replace every entity ID marked <<REPLACE>> with your own.
# See README.md for how to find each one.
#
# Everything is governed by input_select.driveway_mode:
#
#   Auto      — motion controls the lights (normal running)
#   Force on  — lights on and stay on, motion ignored (matchdays, working outside)
#   Force off — lights off and stay off, motion ignored (guests staying over)
#
# Force on reverts to Auto at sunrise, so lights left on overnight by accident
# don't burn all day.

# ---------------------------------------------------------------------------
# Helpers
# ---------------------------------------------------------------------------

input_select:
  driveway_mode:
    name: Driveway lighting mode
    icon: mdi:tune-variant
    options:
      - Auto
      - Force on
      - Force off

input_boolean:
  # Set while an automation is driving the switches, so manual-use detection can
  # tell a human at the switch apart from our own actions.
  driveway_system_acting:
    name: Driveway system acting
    icon: mdi:robot

  # When on, "Force on" reverts to Auto at sunrise. Turn off if you deliberately
  # want the lights to stay on across a whole day.
  driveway_sunrise_revert:
    name: Revert force-on at sunrise
    icon: mdi:weather-sunset-up

input_number:
  driveway_light_minutes:
    name: Driveway light duration
    min: 1
    max: 30
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-outline

  driveway_trip_limit:
    name: Motion trips before lockout
    min: 3
    max: 60
    step: 1
    icon: mdi:bug-outline

counter:
  driveway_motion_trips:
    name: Driveway motion trips this hour
    initial: 0
    step: 1

timer:
  driveway_lights:
    name: Driveway light timer
    duration: "00:05:00"
    restore: true

  driveway_lockout:
    name: Driveway motion lockout
    duration: "01:00:00"
    restore: true

# ---------------------------------------------------------------------------
# Scripts — the override, exposed as one-tap actions
# ---------------------------------------------------------------------------

script:
  driveway_force_on:
    alias: "Driveway: force lights on"
    icon: mdi:lightbulb-on
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.driveway_mode
        data:
          option: Force on

  driveway_force_off:
    alias: "Driveway: force lights off"
    icon: mdi:lightbulb-off
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.driveway_mode
        data:
          option: Force off

  driveway_auto:
    alias: "Driveway: back to motion control"
    icon: mdi:motion-sensor
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.driveway_mode
        data:
          option: Auto

# ---------------------------------------------------------------------------
# Automations
# ---------------------------------------------------------------------------

automation:
  # 1. The override. Any mode change applies immediately and cancels whatever the
  #    motion automations were doing — this always wins.
  - id: talli_driveway_apply_mode
    alias: "Driveway: apply lighting mode"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.driveway_mode
    conditions:
      # Ignore restarts and attribute-only changes.
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state != trigger.to_state.state }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.driveway_system_acting

      - action: timer.cancel
        target:
          entity_id: timer.driveway_lights

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'Force on' }}"
            sequence:
              - action: homeassistant.turn_on
                target:
                  entity_id:
                    - switch.driveway_floodlights # <<REPLACE>> Grid Connect switch
                    - switch.sign_light # <<REPLACE>> Tapo/Kasa plug
        # Force off and Auto both return the lights to off; in Auto, motion takes
        # over again from a known state.
        default:
          - action: homeassistant.turn_off
            target:
              entity_id:
                - switch.driveway_floodlights # <<REPLACE>>
                - switch.sign_light # <<REPLACE>>

      # Let the switches report their new state before re-arming manual detection,
      # otherwise our own switching can be misread as a human at the switch.
      - delay: "00:00:02"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.driveway_system_acting

  # 2. The motion handler. Everything motion-triggered lives here so that normal
  #    lighting and the after-hours deterrent can't fight over the same switch.
  #    mode: restart means fresh motion extends the timer, never stacks.
  - id: talli_driveway_motion_response
    alias: "Driveway: motion response"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.aarlo_motion_driveway # <<REPLACE>>
        to: "on"
    conditions:
      # Motion only acts in Auto — a manual override suppresses it entirely.
      - condition: state
        entity_id: input_select.driveway_mode
        state: Auto
      # Lockout active means the runaway guard has tripped — stay off.
      - condition: state
        entity_id: timer.driveway_lockout
        state: idle
      # Only after dark. Elevation -4 is roughly civil dusk, so the lights come on
      # slightly before full dark rather than well after it.
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: -4
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.driveway_system_acting

      - action: counter.increment
        target:
          entity_id: counter.driveway_motion_trips

      # Start the timer before switching anything, so the manual-use detector
      # never sees an idle timer during our own switching.
      - action: timer.start
        target:
          entity_id: timer.driveway_lights
        data:
          duration: >-
            {{ (states('input_number.driveway_light_minutes') | int(5) * 60)
               | timestamp_custom('%H:%M:%S', false) }}

      - action: homeassistant.turn_on
        target:
          entity_id:
            - switch.driveway_floodlights # <<REPLACE>>
            - switch.sign_light # <<REPLACE>>

      # Between 23:00 and 05:00 nobody should be on the property: flash the lights
      # as a deterrent, then notify with a snapshot.
      - if:
          - condition: time
            after: "23:00:00"
            before: "05:00:00"
        then:
          - repeat:
              count: 3
              sequence:
                - action: homeassistant.turn_off
                  target:
                    entity_id: switch.driveway_floodlights # <<REPLACE>>
                - delay: "00:00:01"
                - action: homeassistant.turn_on
                  target:
                    entity_id: switch.driveway_floodlights # <<REPLACE>>
                - delay: "00:00:01"

          - action: camera.snapshot
            target:
              entity_id: camera.aarlo_driveway # <<REPLACE>>
            data:
              filename: /config/www/driveway_latest.jpg

          - action: notify.mobile_app_phone # <<REPLACE>>
            data:
              title: After-hours driveway motion
              message: "Motion detected at {{ now().strftime('%H:%M') }}."
              data:
                image: /local/driveway_latest.jpg

      - delay: "00:00:02"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.driveway_system_acting

  # 3. Timer expiry turns the lights back off. Only in Auto — if an override came
  #    in while the timer was running, the override owns the lights now.
  - id: talli_driveway_lights_off
    alias: "Driveway: timer expiry turns lights off"
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.driveway_lights
    conditions:
      - condition: state
        entity_id: input_select.driveway_mode
        state: Auto
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.driveway_system_acting

      - action: homeassistant.turn_off
        target:
          entity_id:
            - switch.driveway_floodlights # <<REPLACE>>
            - switch.sign_light # <<REPLACE>>

      - delay: "00:00:02"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.driveway_system_acting

  # 4. Runaway guard. Insects drawn to the floodlight, heavy rain, or a tree in the
  #    wind can retrigger motion endlessly and flatten the camera battery overnight.
  #    Exceed the trip limit within an hour and we kill the lights and lock out.
  #    Never overrides a deliberate Force on.
  - id: talli_driveway_runaway_guard
    alias: "Driveway: runaway motion lockout"
    mode: single
    triggers:
      - trigger: state
        entity_id: counter.driveway_motion_trips
    conditions:
      - condition: state
        entity_id: input_select.driveway_mode
        state: Auto
      - condition: template
        value_template: >-
          {{ states('counter.driveway_motion_trips') | int(0)
             >= states('input_number.driveway_trip_limit') | int(12) }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.driveway_system_acting

      - action: timer.cancel
        target:
          entity_id: timer.driveway_lights

      - action: homeassistant.turn_off
        target:
          entity_id:
            - switch.driveway_floodlights # <<REPLACE>>
            - switch.sign_light # <<REPLACE>>

      - action: timer.start
        target:
          entity_id: timer.driveway_lockout

      - delay: "00:00:02"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.driveway_system_acting

      - action: notify.mobile_app_phone # <<REPLACE>>
        data:
          title: Driveway motion lockout
          message: >-
            {{ states('counter.driveway_motion_trips') }} motion trips in the last
            hour — lights off for 60 minutes. Most likely insects on the floodlight.
            Set the mode to Force on if you need them anyway.

  # 5. Reset the trip counter hourly, so the guard measures a rolling hour.
  - id: talli_driveway_counter_reset
    alias: "Driveway: hourly trip counter reset"
    mode: single
    triggers:
      - trigger: time_pattern
        hours: "/1"
    actions:
      - action: counter.reset
        target:
          entity_id: counter.driveway_motion_trips

  # 6. Physical switch use is treated as an override too, so flipping the switch on
  #    the wall or in the Grid Connect app behaves the same as tapping Force on.
  - id: talli_driveway_manual_detect
    alias: "Driveway: switch used by hand means force on"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.driveway_floodlights # <<REPLACE>>
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.driveway_system_acting
        state: "off"
      - condition: state
        entity_id: timer.driveway_lights
        state: idle
      - condition: template
        value_template: "{{ states('input_select.driveway_mode') != 'Force on' }}"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.driveway_mode
        data:
          option: Force on

  - id: talli_driveway_manual_clear
    alias: "Driveway: switch turned off by hand returns to auto"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.driveway_floodlights # <<REPLACE>>
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.driveway_system_acting
        state: "off"
      - condition: state
        entity_id: input_select.driveway_mode
        state: Force on
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.driveway_mode
        data:
          option: Auto

  # 7. Safety net for a Force on left running: revert to Auto at sunrise so the
  #    lights don't burn all day. Disable via the sunrise revert toggle.
  - id: talli_driveway_sunrise_revert
    alias: "Driveway: revert force-on at sunrise"
    mode: single
    triggers:
      - trigger: sun
        event: sunrise
    conditions:
      - condition: state
        entity_id: input_select.driveway_mode
        state: Force on
      - condition: state
        entity_id: input_boolean.driveway_sunrise_revert
        state: "on"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.driveway_mode
        data:
          option: Auto

  # 8. Clear the acting flag on restart, in case HA went down mid-run and left it
  #    stuck on, which would disable manual-use detection.
  - id: talli_driveway_reset_acting_flag
    alias: "Driveway: clear acting flag on restart"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.driveway_system_acting

  # 9. Battery warning. A Pro 3 Floodlight serving frequent motion events drains
  #    much faster than Arlo's rated life — catch it before the automations die.
  - id: talli_driveway_battery_warning
    alias: "Driveway: camera battery low"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.aarlo_battery_level_driveway # <<REPLACE>>
        below: 25
        for: "00:10:00"
    actions:
      - action: notify.mobile_app_phone # <<REPLACE>>
        data:
          title: Arlo battery low
          message: >-
            Driveway camera at {{ states('sensor.aarlo_battery_level_driveway') }}%.
            Charge it or the motion automations stop working.
