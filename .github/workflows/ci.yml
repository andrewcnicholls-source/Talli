# =====================================================================
#  CI for Talli.
#
#  Runs the same script a contributor runs locally — scripts/check.sh —
#  so a green PR means the same thing as a green terminal. There is
#  deliberately nothing here that cannot also be run by hand.
#
#  This gate sits in front of `staging`, which deploys to the shared
#  device-test site, and in front of `main`, which is the live booking
#  site. See DEPLOYMENT.md.
# =====================================================================
name: checks

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan and the migration checks read tracked files
          # via `git ls-files`, which needs the repository, not a
          # partial checkout of the diff.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run project checks
        run: bash scripts/check.sh

  # -------------------------------------------------------------------
  #  Edge function typechecking.
  #
  #  Separate from `check` because it needs the network: the functions
  #  import Stripe from esm.sh and supabase-js from jsr.io, and a sandbox
  #  that cannot reach those hosts gets an import failure rather than an
  #  answer. GitHub's runners can reach them, so this is where the real
  #  answer comes from.
  #
  #  It ran `continue-on-error` until it had been green once, because
  #  wiring an unseen check into the gate would have blocked every PR on
  #  a guess. It went green on 2 Sep 2026, so it is a real check now.
  #
  #  STILL TO DO, and it cannot be done from here: add `typecheck` to
  #  the required checks in branch protection for `staging` and `main`.
  #  Until that happens a failure here is a red X, not a blocked merge.
  # -------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check
        run: deno check supabase/functions/*/index.ts
