# =====================================================================
#  CI for Talli.
#
#  Runs the same script a contributor runs locally — scripts/check.sh —
#  so a green PR means the same thing as a green terminal. There is
#  deliberately nothing here that cannot also be run by hand.
#
#  This gate sits in front of `staging`, which deploys to the shared
#  device-test site, and in front of `main`, which is the live booking
#  site. See DEPLOYMENT.md.
# =====================================================================
name: checks

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan and the migration checks read tracked files
          # via `git ls-files`, which needs the repository, not a
          # partial checkout of the diff.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run project checks
        run: bash scripts/check.sh

  # -------------------------------------------------------------------
  #  Edge function typechecking.
  #
  #  Separate, and deliberately NOT required yet. `deno check` has never
  #  been run against these functions — their imports (esm.sh, jsr.io)
  #  are unreachable from the sandbox they were written in, so nobody
  #  has seen the result. Wiring an unseen check into the required gate
  #  would block every PR on a guess.
  #
  #  GitHub's runners can reach those hosts, so this job gets a real
  #  answer. Once it has been green on a PR, delete `continue-on-error`
  #  and add `typecheck` to the required checks in branch protection.
  # -------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check
        run: deno check supabase/functions/*/index.ts
