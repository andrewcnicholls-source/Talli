# =====================================================================
#  CI for Talli.
#
#  Runs the same script a contributor runs locally — scripts/check.sh —
#  so a green PR means the same thing as a green terminal. There is
#  deliberately nothing here that cannot also be run by hand. That script
#  now includes the automated suites (TESTING.md, "Automated tests").
#
#  This gate sits in front of `staging`, which deploys to the shared
#  device-test site, and in front of `main`, which is the live booking
#  site. See DEPLOYMENT.md.
# =====================================================================
name: checks

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan and the migration checks read tracked files
          # via `git ls-files`, which needs the repository, not a
          # partial checkout of the diff.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # The suites' tools (plan T0): Playwright and the Supabase CLI. They
      # live in tests/, not the repository root, so Cloudflare Pages never
      # sees a package.json and keeps serving the repository as it is.
      - name: Install test tools
        run: npm ci --prefix tests

      - name: Install the browser
        run: npx --prefix tests playwright install --with-deps chromium

      # Static checks, then units, then the database, edge function and
      # browser suites against a local Supabase stack that check.sh starts
      # here in Docker, built from supabase/migrations/ from empty. CI=true
      # makes a suite that could not run a failure, not a skip.
      - name: Run project checks
        run: bash scripts/check.sh

      - name: Keep the browser run's videos and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            tests/test-results/
            tests/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  #  Edge function typechecking.
  #
  #  Separate from `check` because it needs the network: the functions
  #  import Stripe from esm.sh and supabase-js from jsr.io, and a sandbox
  #  that cannot reach those hosts gets an import failure rather than an
  #  answer. GitHub's runners can reach them, so this is where the real
  #  answer comes from.
  #
  #  It ran `continue-on-error` until it had been green once, because
  #  wiring an unseen check into the gate would have blocked every PR on
  #  a guess. It went green on 2 Sep 2026, so it is a real check now.
  #
  #  STILL TO DO, and it cannot be done from here: add `typecheck` to
  #  the required checks in branch protection for `staging` and `main`.
  #  Until that happens a failure here is a red X, not a blocked merge.
  # -------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check
        run: deno check supabase/functions/*/index.ts
